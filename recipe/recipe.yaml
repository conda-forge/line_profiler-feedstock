schema_version: 1

context:
  version: "5.1.0"

package:
  name: line_profiler
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/line_profiler/line_profiler-${{ version }}.tar.gz
  sha256: 5717a2dccf0ced65fd19ba5e479581c47412831fe768bc211c6d0f5ba1ad9b47

build:
  number: 0
  script:
    - if: osx and arm64
      then: "export CMAKE_OSX_ARCHITECTURES=\"arm64\""
    - ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - kernprof = kernprof:main

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - cython >=3.0.3
    - ${{ compiler("cxx") }}
    - ${{ stdlib("c") }}
  host:
    - python
    - pip
    - cython >=3.0.3
    - setuptools
  run:
    - python
    - if: match(python, "<3.11")
      then: tomli
    - typing_extensions
  run_constraints:
    - ipython >=8.14.0
    - rich >=13.9.0

tests:
  - python:
      imports:
        - kernprof
        - line_profiler
      pip_check: true
  - script:
      - kernprof --help
      - python -m kernprof --help

about:
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: A module for monitoring memory usage of a python program
  homepage: https://github.com/pyutils/line_profiler
  repository: https://github.com/pyutils/line_profiler
  documentation: https://github.com/pyutils/line_profiler

extra:
  recipe-maintainers:
    - jakirkham
    - grlee77
    - synapticarbors
